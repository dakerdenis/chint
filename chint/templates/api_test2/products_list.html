<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Products</title>
</head>
<body>

<h2>Products (page {{ page }} / {{ pages }})</h2>

<ul>
{% for p in products %}
    <li>
        <a href="/api-test2/products/{{ p.vendor_code }}/">
            {{ p.vendor_code }} — {{ p.short_name }}
        </a>
    </li>
{% endfor %}
</ul>

<hr>

<div>
{% if page > 1 %}
    <a href="?page={{ page|add:-1 }}">← Prev</a>
{% endif %}

{% if page < pages %}
    <a href="?page={{ page|add:1 }}">Next →</a>
{% endif %}
</div>

</body>
</html>
