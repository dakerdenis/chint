<li>
  <div class="node">
    <a href="/api-test2/catalog/{{ category.id }}/">
      {{ category.name }}
    </a>
  </div>

  {% if category.children %}
    <ul class="children">
      {% for child in category.children %}
        {% include "api_test2/category_node.html" with category=child %}
      {% endfor %}
    </ul>
  {% endif %}
</li>
